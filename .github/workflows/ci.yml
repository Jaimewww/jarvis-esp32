name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # backend/.venv is pinned to Python 3.14 by pyrightconfig.json (extraPaths).
  PYTHON_VERSION: "3.14"

jobs:
  backend-tests:
    name: backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  host-tests:
    name: host · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v5
      # host/ gains its test suite and requirements-dev.txt in a later pull
      # request; until that file exists every step below is skipped.
      - uses: actions/setup-python@v6
        if: hashFiles('host/requirements-dev.txt') != ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: host/requirements*.txt
      - name: Install dependencies
        if: hashFiles('host/requirements-dev.txt') != ''
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        if: hashFiles('host/requirements-dev.txt') != ''
        run: python -m pytest tests -q

  host-systemd:
    name: host · systemd unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Runs against a temporary HOME with stubbed systemctl/node: nothing is
      # installed or started on the runner.
      - name: Test the Gentle Dot unit and its install script
        run: bash host/systemd/test_install.sh

  host-input:
    name: host · jarvis-input unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The keycode slot plan resolves keysyms with libxkbcommon (ctypes), as wtype does; without
      # it the helper degrades to a built-in table and the tests that need the library skip.
      - name: Install libxkbcommon
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon0
      # Stdlib only. The helper runs in-process on a temporary XDG_RUNTIME_DIR with fake
      # wtype/grim/niri on PATH; nothing touches a display.
      - name: Test the jarvis-input helper
        run: python3 -m unittest discover -s host/input/tests
      # The desktop E2E runner needs a Wayland (niri) session, wtype and a Chromium browser;
      # on the runner it prints "SKIP: requirements …" and exits 77. Any other code fails.
      - name: Desktop E2E (skips without a Wayland session)
        run: |
          code=0
          host/e2e/run.sh || code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 77 ]

  gentle-dot-extension:
    name: host · gentle-dot extension (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Node 24 strips TypeScript types natively; the tests import only node: built-ins and
      # pc-control-core.ts, so there is nothing to npm install.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test the pc-control extension
        run: node --test host/gentle-dot/tests/*.test.ts

  jarvis-stop:
    name: host · jarvis-stop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Temporary sandbox with stub pkill/notify-send, a fake control socket and a fake daemon;
      # jarvis-stop itself runs /usr/bin/python3 (system Python on the runner).
      - name: Test the emergency stop script
        run: bash host/bin/test_jarvis_stop.sh

  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Create backend/.venv (pyrightconfig.json resolves imports from it)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Install pyright
        run: python -m pip install pyright==1.1.414
      - name: Type-check
        run: pyright
